<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validación de autenticidad del Permiso</title>
<style>
  :root{
    --navy:#1c2f6b;
    --maroon:#8f1738;
    --gray-bg:#e9e9e9;
    --input-bg:#efefef;
    --input-border:#c9c9c9;
    --help-bubble:#8f8fc7;
    --text-dark:#1a1a1a;
    --footer-bg:#e7e7e7;
    --btn-gray:#9a9a9a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    color:var(--text-dark);
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width:640px;
    background:#ffffff;
    min-height:100vh;
    box-shadow:0 0 24px rgba(0,0,0,0.08);
  }

  /* HEADER */
  .header{
    display:flex;
    align-items:center;
    gap:18px;
    padding:28px 24px 22px;
  }

  .car-icon{
    flex:0 0 auto;
    width:90px;
    height:auto;
    object-fit:contain;
  }

  .header-text{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .eyebrow{
    font-size:1.15rem;
    color:var(--navy);
    font-weight:400;
    margin:0;
  }

  .title{
    font-size:2.3rem;
    line-height:1.08;
    color:var(--navy);
    font-weight:700;
    margin:4px 0 0;
    letter-spacing:0.2px;
  }

  /* STEP BANNER */
  .step-banner{
    background:var(--maroon);
    color:#fff;
    text-align:center;
    padding:14px 12px 16px;
  }

  .step-banner .step-num{
    font-size:1.4rem;
    font-weight:600;
    margin:0;
  }

  .step-banner .step-sub{
    font-size:1rem;
    font-weight:400;
    margin:2px 0 0;
    opacity:0.95;
  }

  /* FORM */
  .form-wrap{
    padding:24px 24px 8px;
  }

  .required-note{
    font-style:italic;
    font-size:0.95rem;
    margin:0 0 26px;
  }

  .field{
    margin-bottom:26px;
  }

  .field label{
    display:block;
    text-align:center;
    font-size:1.4rem;
    margin-bottom:12px;
  }

  .field label .req{
    color:var(--text-dark);
  }

  .field-row{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .field-row input{
    flex:1 1 auto;
    height:44px;
    border-radius:6px;
    border:1px solid var(--input-border);
    background:var(--input-bg);
    padding:0 14px;
    font-size:1rem;
    color:#555;
    font-family:inherit;
  }

  .field-row input::placeholder{
    color:#9a9a9a;
    letter-spacing:1px;
  }

  .field-row input:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
    background:#fff;
  }

  .help-bubble{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--help-bubble);
    color:#fff;
    border:none;
    font-size:1rem;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-family:Georgia, serif;
    font-style:italic;
  }

  .accept-btn{
    width:100%;
    height:52px;
    border-radius:6px;
    background:var(--gray-bg);
    border:1px solid #cfcfcf;
    color:#3a3a3a;
    font-size:1.3rem;
    font-weight:400;
    cursor:pointer;
    margin-top:10px;
    font-family:inherit;
  }

  .accept-btn:hover{
    background:#dedede;
  }

  /* AVISOS BANNER */
  .avisos-banner{
    background:var(--maroon);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:22px 24px;
    margin-top:28px;
  }

  .avisos-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#3a3a3a;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }

  .avisos-icon span{
    color:var(--maroon);
    font-family:Georgia, serif;
    font-weight:700;
    font-style:italic;
    font-size:1.6rem;
  }

  .avisos-title{
    font-size:1.7rem;
    font-weight:400;
    margin:0;
  }

  /* RESULTADO */
  .result-wrap{
    padding:16px 24px;
  }

  .result-card{
    background:#f9f9f9;
    border-left:6px solid var(--maroon);
    padding:16px 20px;
    border-radius:6px;
    margin-top:10px;
    font-size:0.95rem;
    box-shadow:0 1px 4px rgba(0,0,0,0.05);
  }

  .result-card .field-label{
    font-weight:600;
    color:var(--navy);
    display:inline-block;
    min-width:130px;
  }

  .result-card .row{
    padding:6px 0;
    border-bottom:1px solid #e0e0e0;
  }

  .result-card .row:last-child{
    border-bottom:none;
  }

  .result-card .badge{
    display:inline-block;
    background:var(--maroon);
    color:#fff;
    padding:2px 14px;
    border-radius:20px;
    font-size:0.8rem;
    font-weight:600;
    letter-spacing:0.5px;
  }

  .error-msg{
    background:#fbe9e9;
    border-left:6px solid #b22222;
    padding:14px 18px;
    border-radius:4px;
    color:#7a1a1a;
    font-weight:500;
  }

  /* FOOTER */
  .footer{
    background:var(--footer-bg);
    padding:20px 24px 28px;
  }

  .footer p{
    margin:0 0 18px;
    font-size:1rem;
    line-height:1.35;
  }

  .requisitos-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--btn-gray);
    color:#fff;
    text-decoration:none;
    padding:16px;
    border-radius:6px;
    font-size:1.3rem;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }

  .requisitos-btn:hover{
    background:#888;
  }

  /* Responsive */
  @media (min-width:641px){
    body{
      background:#dcdcdc;
      padding:32px 0;
    }
    .page{
      border-radius:10px;
      overflow:hidden;
      min-height:auto;
    }
  }

  @media (max-width:400px){
    .title{font-size:1.9rem;}
    .car-icon{width:70px;}
    .field label{font-size:1.2rem;}
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <img class="car-icon" src="https://i.postimg.cc/nLczwNCQ/IMG-6748.png" alt="Icono de control vehicular">
    <div class="header-text">
      <p class="eyebrow">Trámites en línea de Control Vehicular</p>
      <h1 class="title">Validación de autenticidad del Permiso</h1>
    </div>
  </div>

  <div class="step-banner">
    <p class="step-num">Paso 1</p>
    <p class="step-sub">Ingresar Información</p>
  </div>

  <form class="form-wrap" id="searchForm" onsubmit="return false;">
    <p class="required-note">Los datos marcados con * son obligatorios.</p>

    <div class="field">
      <label for="folio">No. De Folio del Permiso: <span class="req">*</span></label>
      <div class="field-row">
        <input type="text" id="folio" name="folio" placeholder="" required>
        <button type="button" class="help-bubble" aria-label="Ayuda folio">?</button>
      </div>
    </div>

    <div class="field">
      <label for="niv">NIV: <span class="req">*</span></label>
      <div class="field-row">
        <input type="text" id="niv" name="niv" placeholder="" required>
        <button type="button" class="help-bubble" aria-label="Ayuda NIV">?</button>
      </div>
    </div>

    <div class="field">
      <label for="fecha">Fecha de expedición : <span class="req">*</span></label>
      <div class="field-row">
        <input type="text" id="fecha" name="fecha" placeholder="DD/MM/YYYY" maxlength="10" required>
        <button type="button" class="help-bubble" aria-label="Ayuda fecha">?</button>
      </div>
    </div>

    <button type="submit" class="accept-btn" id="buscarBtn">Aceptar</button>
  </form>

  <!-- Resultados -->
  <div class="result-wrap" id="resultadoWrap">
    <!-- Aquí se renderiza el resultado -->
  </div>

  <div class="avisos-banner">
    <div class="avisos-icon"><span>i</span></div>
    <p class="avisos-title">Avisos</p>
  </div>

  <div class="footer">
    <p>* Los requisitos para este trámite se pueden consultar en el enlace de la parte derecha de esta sección:</p>
    <button type="button" class="requisitos-btn">Requisitos</button>
  </div>

</div>

  // ================================================================
  // 2. ELEMENTOS DOM
  // ================================================================
  const inputFolio = document.getElementById('folio');
  const inputNiv = document.getElementById('niv');
  const inputFecha = document.getElementById('fecha');
  const btnBuscar = document.getElementById('buscarBtn');
  const resultadoWrap = document.getElementById('resultadoWrap');

  // ================================================================
  // 3. FORMATO AUTOMÁTICO DE FECHA (SOLO NÚMEROS → DD/MM/YYYY)
  // ================================================================
  function formatFecha(value) {
    // Eliminar todo lo que no sea número
    let clean = value.replace(/\D/g, '');
    
    // Limitar a 8 dígitos (DDMMYYYY)
    if (clean.length > 8) {
      clean = clean.slice(0, 8);
    }
    
    // Aplicar formato DD/MM/YYYY
    let formatted = '';
    for (let i = 0; i < clean.length; i++) {
      if (i === 2 || i === 4) {
        formatted += '/';
      }
      formatted += clean[i];
    }
    
    return formatted;
  }

  inputFecha.addEventListener('input', function(e) {
    const cursorPos = this.selectionStart;
    const rawValue = this.value;
    
    // Guardar posición del cursor antes del formato
    const oldLength = rawValue.length;
    
    // Aplicar formato
    const formatted = formatFecha(rawValue);
    this.value = formatted;
    
    // Ajustar posición del cursor
    const newLength = formatted.length;
    let newCursorPos = cursorPos;
    
    // Si se agregó una barra, mover el cursor un paso adelante
    if (newLength > oldLength) {
      // Detectar si se agregó una barra en la posición del cursor
      for (let i = 0; i < newLength; i++) {
        if (i < oldLength && rawValue[i] !== formatted[i]) {
          // Se agregó un carácter (posiblemente una barra)
          newCursorPos = cursorPos + 1;
          break;
        }
      }
    } else if (newLength < oldLength) {
      // Si se eliminó un carácter, ajustar hacia atrás
      newCursorPos = cursorPos - 1;
    }
    
    // Asegurar que el cursor esté dentro de los límites
    if (newCursorPos < 0) newCursorPos = 0;
    if (newCursorPos > formatted.length) newCursorPos = formatted.length;
    
    this.setSelectionRange(newCursorPos, newCursorPos);
  });

  // También permitir que el usuario pueda borrar y editar cómodamente
  inputFecha.addEventListener('keydown', function(e) {
    // Permitir teclas de control (backspace, delete, flechas, etc.)
    const controlKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Tab'];
    if (controlKeys.includes(e.key)) {
      return; // Dejar que el input maneje estas teclas normalmente
    }
    
    // Si es una tecla numérica o de control, permitir
    if (!/^\d$/.test(e.key) && e.key !== 'Enter') {
      e.preventDefault();
    }
  });

  // ================================================================
  // 4. FUNCIÓN DE BÚSQUEDA MULTICRITERIO
  // ================================================================
  function buscarPermiso() {
    const folio = inputFolio.value.trim();
    const niv = inputNiv.value.trim().toUpperCase();
    let fecha = inputFecha.value.trim();

    // Validar campos obligatorios
    if (!folio || !niv || !fecha) {
      resultadoWrap.innerHTML = `
        <div class="result-card error-msg">
          <strong>⚠️ TODOS LOS CAMPOS SON OBLIGATORIOS</strong><br>
          <span style="font-size:0.9rem;">Complete el Folio, NIV y Fecha de expedición para continuar.</span>
        </div>
      `;
      return;
    }

    // Buscar primero por folio
    let permiso = PERMISOS_DATABASE[folio];

    if (!permiso) {
      resultadoWrap.innerHTML = `
        <div class="result-card error-msg">
          <strong>❌ PERMISO NO REGISTRADO</strong><br>
          <span style="font-size:0.9rem;">El folio <strong>${folio}</strong> no existe en la base de datos.</span>
        </div>
      `;
      return;
    }

    // Validar coincidencia de NIV (case insensitive, ya está en mayúsculas)
    const nivDB = permiso.numSerie.toUpperCase();
    if (nivDB !== niv) {
      resultadoWrap.innerHTML = `
        <div class="result-card error-msg">
          <strong>❌ NIV NO COINCIDE</strong><br>
          <span style="font-size:0.9rem;">El NIV ingresado no corresponde al folio <strong>${folio}</strong>.</span>
        </div>
      `;
      return;
    }

    // Validar coincidencia de fecha de expedición (normalizar formato)
    const fechaDB = permiso.fechaExpedicion.trim();
    // Limpiar posibles caracteres extraños en la fecha (ej: "18/05/.2024" -> "18/05/2024")
    const fechaDBLimpia = fechaDB.replace(/\./g, '/').replace(/\/\//g, '/');
    const fechaInputLimpia = fecha.replace(/\./g, '/').replace(/\/\//g, '/');

    if (fechaDBLimpia !== fechaInputLimpia) {
      resultadoWrap.innerHTML = `
        <div class="result-card error-msg">
          <strong>❌ FECHA DE EXPEDICIÓN NO COINCIDE</strong><br>
          <span style="font-size:0.9rem;">La fecha ingresada no corresponde al folio <strong>${folio}</strong>.<br>
          Fecha registrada: <strong>${fechaDB}</strong></span>
        </div>
      `;
      return;
    }

    // ======== TODOS LOS DATOS COINCIDEN: MOSTRAR RESULTADO ========
    resultadoWrap.innerHTML = `
      <div class="result-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap;">
          <span style="font-weight:700; font-size:1.1rem; color:var(--navy);">✅ PERMISO VIGENTE</span>
          <span class="badge">FOLIO: ${folio}</span>
        </div>
        <div class="row"><span class="field-label">Propietario:</span> ${permiso.propietario}</div>
        <div class="row"><span class="field-label">Marca:</span> ${permiso.marca}</div>
        <div class="row"><span class="field-label">Modelo:</span> ${permiso.modelo}</div>
        <div class="row"><span class="field-label">Año:</span> ${permiso.año}</div>
        <div class="row"><span class="field-label">Color:</span> ${permiso.color}</div>
        <div class="row"><span class="field-label">NIV:</span> ${permiso.numSerie}</div>
        <div class="row"><span class="field-label">Núm. Motor:</span> ${permiso.numMotor}</div>
        <div class="row"><span class="field-label">Fecha Expedición:</span> ${permiso.fechaExpedicion}</div>
        <div class="row"><span class="field-label">Fecha Finalización:</span> ${permiso.fechaFinalizacion}</div>
        <div style="margin-top:12px; padding-top:10px; border-top:2px solid var(--maroon); text-align:center; font-size:0.75rem; color:#666; text-transform:uppercase; letter-spacing:1px;">
          SISTEMA DE VERIFICACIÓN VEHICULAR · GOBIERNO
        </div>
      </div>
    `;
  }

  // ================================================================
  // 5. EVENTOS
  // ================================================================
  btnBuscar.addEventListener('click', function(e) {
    e.preventDefault();
    buscarPermiso();
  });

  // Presionar Enter en cualquier campo ejecuta la búsqueda
  [inputFolio, inputNiv, inputFecha].forEach(input => {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        buscarPermiso();
      }
    });
  });

  // ================================================================
  // 6. MENSAJE INICIAL
  // ================================================================
  resultadoWrap.innerHTML = `
    <div class="result-card" style="background:#f3f3f3; border-left-color:#8f8fc7; color:#555;">
      <span style="font-weight:400;">Ingrese el Folio, NIV y Fecha de expedición para validar el permiso.</span>
    </div>
  `;

})();
</script>
